name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Determine test scope
    runs-on: ubuntu-24.04
    outputs:
      run_tests: ${{ steps.scope.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PULL_REQUEST_BASE"
            head="$PULL_REQUEST_HEAD"
            range="$base...$head"
          else
            base="$PUSH_BEFORE"
            head="$HEAD"
            range="$base..$head"
          fi

          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            echo 'run_tests=true' >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$range" | grep -qvE '^(README\.md|docs/|LICENSE$)'; then
            echo 'run_tests=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_tests=false' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    name: Node ${{ matrix.node-version }} unit tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  oci-e2e:
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    name: OCI end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MOOSENEXUS_E2E: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: oras-project/setup-oras@v2
        with:
          version: 1.3.3
      - uses: actions/cache@v4
        with:
          path: ~/.cache/moosenexus-cli/runtime
          key: moosenexus-cli-runtime-linux-${{ hashFiles('src/releases.ts') }}
      - run: npm ci
      - run: MOOSENEXUS_E2E_RUNTIME_DIRECTORY="$HOME/.cache/moosenexus-cli/runtime" npm run test:e2e
