name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }} unit tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  oci-e2e:
    name: OCI end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MOOSENEXUS_E2E: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: oras-project/setup-oras@v2
        with:
          version: 1.3.3
      - uses: actions/cache@v4
        with:
          path: ~/.cache/moosenexus-cli/runtime
          key: moosenexus-cli-runtime-linux-${{ hashFiles('src/releases.ts') }}
      - run: npm ci
      - run: MOOSENEXUS_E2E_RUNTIME_DIRECTORY="$HOME/.cache/moosenexus-cli/runtime" npm run test:e2e
