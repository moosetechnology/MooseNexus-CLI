name: Update Floating Release Tags

on:
  workflow_call:
    inputs:
      tag:
        description: Exact release tag to promote.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag to promote.
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected an exact release tag such as v1.1.0, got: $RELEASE_TAG" >&2
            exit 1
          fi

          git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          if ! git show-ref --tags --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Release tag $RELEASE_TAG does not exist." >&2
            exit 1
          fi

          release_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          release_target="$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish 2>/dev/null)"
          if [ -z "$release_target" ]; then
            echo "GitHub release $RELEASE_TAG does not exist." >&2
            exit 1
          fi
          if [ "$release_target" != "$release_commit" ]; then
            echo "GitHub release $RELEASE_TAG targets $release_target instead of tag commit $release_commit." >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          major="${version%%.*}"
          minor_and_patch="${version#*.}"
          minor="${minor_and_patch%%.*}"

          {
            printf 'commit=%s\n' "$release_commit"
            printf 'major_tag=v%s.x.x\n' "$major"
            printf 'minor_tag=v%s.%s.x\n' "$major" "$minor"
          } >> "$GITHUB_OUTPUT"

      - name: Create floating-tag updater token
        id: floating-tag-updater-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: moosetechnology
          repositories: MooseNexus-CLI
          permission-contents: write
          permission-workflows: write

      - name: Update floating release tags
        env:
          FLOATING_TAG_UPDATER_TOKEN: ${{ steps.floating-tag-updater-token.outputs.token }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          MAJOR_TAG: ${{ steps.release.outputs.major_tag }}
          MINOR_TAG: ${{ steps.release.outputs.minor_tag }}
        run: |
          git remote set-url origin "https://x-access-token:${FLOATING_TAG_UPDATER_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for tag in "$MAJOR_TAG" "$MINOR_TAG"; do
            git tag --force "$tag" "$RELEASE_COMMIT"
            git push origin "refs/tags/$tag" --force
          done
